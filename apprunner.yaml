version: 1.0
runtime: java17
build:
  commands:
    pre-build:
      - mvn clean
    build:
      - mvn package -DskipTests
    post-build:
      - echo "Build completed"

run:
  runtime-version: java17
  command: java -jar target/api-0.0.1-SNAPSHOT.jar
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: "prod"
    - name: DB_HOST
      value: ""  # Set via App Runner environment variables
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "keycloak_app"
    - name: DB_USERNAME
      value: ""  # Set via App Runner secrets
    - name: DB_PASSWORD
      value: ""  # Set via App Runner secrets
    - name: KEYCLOAK_ISSUER_URI
      value: ""  # Set via App Runner environment variables
    - name: KEYCLOAK_JWK_SET_URI
      value: ""  # Set via App Runner environment variables
